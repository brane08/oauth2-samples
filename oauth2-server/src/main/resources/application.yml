server:
  address: 127.0.0.1
  port: 8077
  ssl:
    key-store-type: PKCS12
    key-store: "${user.dir}/../certs/services.p12"
    key-store-password: "changeit"
    trust-store-type: JKS
    trust-store: "${user.dir}/../certs/truststore.jks"
    trust-store-password: "changeit"
    enabled: true
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false
        same-site: lax
        name: "AUTHSESSIONID"
  tomcat:
    accept-count: 250
  error:
    include-exception: true
    include-stacktrace: always
    include-message: always

spring:
  application:
    name: jdbc-oauth2-server
  main:
    banner-mode: off
  datasource:
    url: "jdbc:postgresql://localhost:5432/prore?currentSchema=oauth2"
    driver-class-name: "org.postgresql.Driver"
    hikari:
      pool-name: "auth-server-ds"
      maximum-pool-size: 7
      minimum-idle: 1
    username: "postgres"
    password: ""
  mvc:
    view:
      prefix: "/WEB-INF/jsp/"
      suffix: ".jsp"
  threads:
    virtual:
      enabled: true

logging:
  level:
    root: info
    "org.springframework.security": debug
    "org.springframework.security.web": debug
    "org.springframework.security.web.savedrequest": debug
    #    "org.springframework.security.web.FilterChainProxy": trace
    "org.springframework.security.oauth2": debug
    "org.springframework.security.oauth2.server": debug
    "org.springframework.security.oauth2.core": debug
    "org.springframework.data.mongodb": info
    "org.springframework.session.mongodb": info
    "org.mongodb": warn
    "com.mongodb": warn
    "com.github.brane08.oauth2.server": debug

management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

sas:
  use-redirect-in-filter: false
  gateway-url: https://sso.example.com:8040

jwt:
  keystore-path: "${user.dir}/../certs/jwt-key.jks"
  keystore-password: "changeit"
  key-alias: "sas-jwt-key"
  key-password: "changeit"
  key-id: "gateway-jwt-v1"