LoadModule ssl_module modules/mod_ssl.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule headers_module modules/mod_headers.so

Listen 8040

# Simulates the fronting SSO product for local/test use: injects the Sm_user header
# that PingPreAuthenticationFilter (ping-preauth profile) trusts, then proxies to the
# gateway. Not a TLS-terminating config — local test tool only.
<VirtualHost *:8040>
    ServerName sso.example.local

    RequestHeader set Sm_user "testuser"

    SSLProxyEngine on
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerExpire off

    ProxyPreserveHost On
    ProxyPass "/" "https://sso-gateway-mvc:8078/"
    ProxyPassReverse "/" "https://sso-gateway-mvc:8078/"
</VirtualHost>
