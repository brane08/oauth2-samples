server:
  address: 127.0.0.1
  port: 8078
  ssl:
    key-store-type: PKCS12
    key-store: "${user.dir}/../certs/services.p12"
    key-store-password: "changeit"
    trust-store-type: JKS
    trust-store: "${user.dir}/../certs/truststore.jks"
    trust-store-password: "changeit"
    enabled: true
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false
        same-site: lax
        name: "GTWYSESSIONID"
  forward-headers-strategy: native
  tomcat:
    accept-count: 300
    redirect-context-root: false
  error:
    include-exception: true
    include-stacktrace: always
    include-message: always

spring:
  application:
    name: gateway-service-mvc
  main:
    banner-mode: off
  datasource:
    url: "jdbc:postgresql://localhost:5432/prore?currentSchema=oauth2"
    driver-class-name: "org.postgresql.Driver"
    hikari:
      pool-name: "gateway-ds"
      maximum-pool-size: 7
      minimum-idle: 1
    username: "postgres"
    password: ""
  mvc:
    view:
      prefix: "/WEB-INF/jsp/"
      suffix: ".jsp"
  security:
    oauth2:
      client:
        registration:
          client-oidc:
            client-id: "2e8347f2-ccac-4d03-bc2c-cc733ec4da10"
            client-secret: "secret"
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
        provider:
          client-oidc:
            #            issuer-uri: "http://localhost:8077"
            authorization-uri: "https://auth.example.com:8077/oauth2/authorize"
            token-uri: "https://auth.example.com:8077/oauth2/token"
            jwk-set-uri: "https://auth.example.com:8077/oauth2/jwks"
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: userinfo
              uri: https://auth.example.com:8077
              predicates:
                - Path=/user**
              filters:
                - TokenRelay=
            - id: client1
              uri: https://sso-client1:8081
              predicates:
                - Path=/mvc/**
              filters:
                - TokenRelay=
            - id: client2
              uri: https://sso-client2:8082
              predicates:
                - Path=/flux/**
              filters:
                - TokenRelay=
            - id: client3
              uri: https://sso-client3:8083
              predicates:
                - Path=/vaadin/**
              filters:
                - TokenRelay=
  threads:
    virtual:
      enabled: true

logging:
  level:
    root: info
    "org.springframework.cloud.gateway": info
    "org.springframework.security": debug
    "org.springframework.security.oauth2": debug
    "org.springframework.security.oauth2.client": debug
    "org.springframework.security.oauth2.core.OAuth2TokenValidator": debug
    "org.springframework.security.web": debug
    "org.springframework.security.web.context.HttpSessionSecurityContextRepository": debug
    "org.springframework.security.web.savedrequest.HttpSessionRequestCache": debug
    "org.springframework.web": info
    "org.springframework.web.client.RestTemplate": debug

    "org.springframework.data.mongodb.core.MongoTemplate": info

    "org.springframework.session": info
    "org.mongodb.spring.session": info

    "com.github.brane08.oauth2.sso": debug

management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
