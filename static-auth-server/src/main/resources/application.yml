server:
  address: 127.0.0.1
  port: 8077
  ssl:
    key-store-type: PKCS12
    key-store: "${user.dir}/../certs/services.p12"
    key-store-password: "changeit"
    trust-store-type: JKS
    trust-store: "${user.dir}/../certs/truststore.jks"
    trust-store-password: "changeit"
    enabled: true
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: false
        same-site: lax

spring:
  application:
    name: static-oauth2-server
  main:
    banner-mode: off
  mvc:
    view:
      prefix: "/WEB-INF/jsp/"
      suffix: ".jsp"
  web:
    error:
      include-exception: true
      include-stacktrace: always
      include-message: always

logging:
  level:
    root: info
    "org.springframework.security": debug
    "org.springframework.security.web": debug
    "org.springframework.security.web.savedrequest": debug
    #    "org.springframework.security.web.FilterChainProxy": trace
    "org.springframework.security.oauth2": debug
    "org.springframework.data.mongodb": debug
    "org.springframework.session.mongodb": debug
    "com.github.brane08.oauth2.server": debug

management:
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

sas:
  gateway-url: https://gateway.example.com:8040